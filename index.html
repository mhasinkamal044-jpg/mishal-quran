<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل الدخول | مجمع مشعل الحميدي</title>
  <link rel="stylesheet" href="index.css">
</head>
<body>
  <div class="auth-container">
    <div class="auth-card">

      <div class="logo">
        <div class="logo-icon">📖</div>
        <h1>مجمع مشعل الحميدي</h1>
        <p>لتحفيظ القرآن الكريم</p>
      </div>

      <div class="tabs">
        <button class="tab active" data-tab="login">تسجيل الدخول</button>
        <button class="tab" data-tab="register">إنشاء حساب</button>
      </div>

      <!-- نموذج الدخول -->
      <form id="loginForm" class="auth-form active">
        <label for="loginEmail">البريد الإلكتروني</label>
        <input type="email" id="loginEmail" placeholder="example@mail.com" required>

        <label for="loginPassword">كلمة المرور</label>
        <input type="password" id="loginPassword" placeholder="••••••••" required>

        <button type="submit" class="btn-primary">دخول</button>
        <p class="msg" id="loginMsg"></p>
      </form>

      <!-- نموذج التسجيل -->
      <form id="registerForm" class="auth-form">
        <label for="regName">الاسم الكامل</label>
        <input type="text" id="regName" placeholder="اسمك الكامل" required>

        <label for="regEmail">البريد الإلكتروني</label>
        <input type="email" id="regEmail" placeholder="example@mail.com" required>

        <label for="regPassword">كلمة المرور</label>
        <input type="password" id="regPassword" placeholder="6 أحرف على الأقل" minlength="6" required>

        <button type="submit" class="btn-primary">إنشاء الحساب</button>
        <p class="msg" id="registerMsg"></p>
      </form>

    </div>
  </div>
  <script src="auth.js"></script>
</body>
</html>
